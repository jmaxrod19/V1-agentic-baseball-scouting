# pytest configuration. `testpaths` tells pytest where the tests live so a bare
# `pytest` from the repo root finds them without arguments.
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Keep output readable: quiet the third-party deprecation noise from pandas /
# matplotlib so a real failure isn't buried in warnings.
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
